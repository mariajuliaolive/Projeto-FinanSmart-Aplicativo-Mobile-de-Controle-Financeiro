# ============================================================
# FinanSmart - configuracao do Gradle
# Ajustado para computador com 8 GB de RAM
# ============================================================

# --- Memoria ---------------------------------------------------------------
# Heap do processo do Gradle. 1,5 GB cabe com folga numa maquina de 8 GB.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# CORRECAO DO ERRO "Could not connect to Kotlin compile daemon":
# roda o compilador Kotlin DENTRO do processo do Gradle, em vez de abrir
# um segundo processo Java que nao cabia na memoria.
kotlin.compiler.execution.strategy=in-process

# Nao compilar varios modulos ao mesmo tempo (economiza memoria).
org.gradle.parallel=false

# --- Velocidade ------------------------------------------------------------
# Reaproveita resultados de builds anteriores.
org.gradle.caching=true
# Só configura os modulos que a tarefa realmente precisa.
org.gradle.configureondemand=true
# Pula a fase de configuracao quando nada mudou.
org.gradle.configuration-cache=true

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
